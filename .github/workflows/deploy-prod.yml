name: Deploy → Production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (leave blank for HEAD of main)"
        required: false
        default: ""

concurrency:
  group: deploy-prod
  cancel-in-progress: false  # never cancel a prod deploy mid-flight

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://your-app.com  # ← update this

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || 'main' }}

      # ── Backend ──────────────────────────────────────────────────────────
      - name: Deploy backend to Production
        env:
          # Add your deploy secrets in GitHub → Settings → Environments → production
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "TODO: replace with your real deploy command"
          echo "e.g.: fly deploy --app my-app-prod"
          echo "      railway up --environment production"

      # ── Frontend ─────────────────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://api.your-app.com  # ← update this
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to Production
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "TODO: replace with your real deploy command"
          echo "e.g.: vercel --prod --token \$DEPLOY_TOKEN"
          echo "      netlify deploy --prod --dir frontend/dist"

      - name: Notify production deployed
        run: echo "🚀 Production deploy complete — SHA ${{ github.sha }}"
