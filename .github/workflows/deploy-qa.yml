name: Deploy → QA

on:
  push:
    branches: [main]

concurrency:
  group: deploy-qa
  cancel-in-progress: true

jobs:
  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://qa.your-app.com  # ← update this

    steps:
      - uses: actions/checkout@v4

      # ── Backend ──────────────────────────────────────────────────────────
      - name: Deploy backend to QA
        env:
          # Add your deploy secrets in GitHub → Settings → Environments → qa
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "TODO: replace with your real deploy command"
          echo "e.g.: fly deploy --app my-app-qa"
          echo "      railway up --environment qa"
          echo "      aws ecs update-service ..."

      # ── Frontend ─────────────────────────────────────────────────────────
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://api-qa.your-app.com  # ← update this
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to QA
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "TODO: replace with your real deploy command"
          echo "e.g.: vercel --prod --token \$DEPLOY_TOKEN"
          echo "      netlify deploy --prod --dir frontend/dist"
          echo "      aws s3 sync frontend/dist s3://my-bucket-qa"

      - name: Notify QA deployed
        run: echo "✅ QA deploy complete — SHA ${{ github.sha }}"
